# Advisory lint rules (quire-rs FR-036; format-walkthrough decision #12):
# Configuration Scope cells use the blessed scope vocabulary. Evaluated
# by `quire lint`; never blocks validation/extraction/sync.
lint_rules:
- type: table_column_values
  id: configuration-scope
  section: Configuration
  column: Scope
  allowed: [creation, runtime, session]
  severity: warning
object_types:
- name: configuration
  roles: [configurable]
  allowed_links:
    configures: [configurable]
    references: [configuration]
  data_schema:
    schema: schemas/Configuration.json
    digest: sha256:20151856a9cda771e838278fafd6f1f8af3b279e222233c44a82fcc91032aa2d
  body_extraction:
    yield_pattern:
      match:
        id: &id001
          from: frontmatter_field
          path:
          - id
          required: true
        title: &id002
          from: frontmatter_field
          path:
          - title
          required: true
        type: &id003
          from: frontmatter_field
          path:
          - type
          required: true
        # Format-walkthrough decision #12 (2026-06-11): Parameters vs
        # Settings was a near-synonym guessing game. ONE required
        # `## Configuration` table with an explicit Scope column carries
        # the semantic as data: Scope ∈ creation | runtime | session
        # (enforced by the `configuration-scope` lint rule below).
        configuration_table:
          from: table_row
          under_section: Configuration
          required: true
          assert:
            columns:
            - Name
            - Scope
            - Type
            - Default
            - Description
            min_rows: 1
        behavior:
          from: section_body
          after_heading: Behavior
          required: false
        # Added at 0.3.0 (issue #6, FR-005): the typed `## Properties`
        # table (`Field | Type | Multiplicity | Constraints`) or its
        # `sysml` fence alternate. `required: false` so every 0.2.0
        # artifact stays valid (FR-003-CON-2, NFR-001).
        properties:
          from: section_body
          after_heading: Properties
          required: false
        # Added at 0.3.0 (issue #6, FR-005): one `### <clauseId>` per
        # clause, each owning one ```ocl``` fence.
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
- name: migration
  allowed_links:
    migrates: [data_schema]
    depends_on: [migration]
  data_schema:
    schema: schemas/Migration.json
    digest: sha256:3a397942625a2234b86a95a488e36870dc9b5eaf26265a57ac2305ad5c78180c
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
